name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The statistical core is pure stdlib: run the full suite with no dependencies
  # across several Python versions. Oracle tests skip automatically here.
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite (stdlib only)
        run: python -m unittest discover -s tests -p "test_*.py" -v

  # Install the scientific stack so the SciPy/statsmodels oracle tests actually
  # execute and cross-validate the pure-Python core.
  oracle-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation oracles
        run: python -m pip install --upgrade pip scipy statsmodels numpy
      - name: Run test suite with oracle cross-validation
        run: python -m unittest discover -s tests -p "test_*.py" -v
