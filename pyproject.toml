[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "statlab"
version = "1.2.0"
description = "Plataforma de análise estatística científica para laboratório (ANOVA/Welch/Tukey/Games-Howell/CLD, não-paramétricos, fatorial)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "VHFSales" }]
keywords = ["statistics", "anova", "tukey", "games-howell", "cld", "science", "laboratory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
]
# The statistical CORE has NO third-party runtime dependencies (pure stdlib),
# by design (transparency, auditability, offline testability). The optional extras
# below power the outer layers (import/plots/export/UI) and the validation oracle.
dependencies = []

[project.optional-dependencies]
data = ["pandas>=1.3", "openpyxl>=3.0"]
plots = ["matplotlib>=3.4"]
ui = ["streamlit>=1.20", "pandas>=1.3"]
app = ["pandas>=1.3", "openpyxl>=3.0", "matplotlib>=3.4", "streamlit>=1.20"]
# Optional validation oracles: enable to cross-check the pure-Python core.
oracle = ["scipy>=1.7", "statsmodels>=0.13", "numpy>=1.21"]
dev = ["scipy>=1.7", "statsmodels>=0.13", "numpy>=1.21", "pandas>=1.3",
       "openpyxl>=3.0", "matplotlib>=3.4"]

[project.urls]
Repository = "https://github.com/VHFSales/statlab"

# NOTE on packaging: the statistical core lives in the top-level package
# ``statistics/`` (shadows the stdlib module only within this project's own
# sys.path). StatLab is developed and run as an application (see README). A future
# release may rename the package to ``statlab_stats`` to make it a cleanly
# importable library; that rename is deliberately deferred to avoid a large,
# risky churn across the validated modules.

[tool.setuptools]
packages = ["statistics", "data", "plots", "reports", "persistence", "app",
            "app.core", "app.ui"]

[tool.setuptools.package-data]
"*" = ["*.md"]
